    <script type="module">
      import { createTimeline, set } from "https://esm.sh/animejs";

      set("svg *", {
        transformOrigin: "center",
        transformBox: "fill-box",
      });

      function setupHoverAnimation(groupId, buildTimeline) {
        const group = document.getElementById(groupId);
        if (!group) return;

        const eyes = group.querySelectorAll('[id^="eye"]');
        if (eyes.length === 0) return;

        const timeline = buildTimeline(eyes);

        group.style.cursor = "pointer";

        group.addEventListener("mouseenter", () => {
          timeline.restart();
        });

        group.addEventListener("mouseleave", () => {
          timeline.pause();
          set(eyes, {
            x: 0,
            y: 0,
            rotate: 0,
            scale: 1,
          });
        });
      }

      setupHoverAnimation("star", (eyes) =>
        createTimeline({
          loop: true,
          autoplay: false,
          defaults: { ease: "linear" },
        }).add(eyes, {
          rotate: [0, 360],
          duration: 900,
        }),
      );

      setupHoverAnimation("alien", (eyes) =>
        createTimeline({
          loop: true,
          autoplay: false,
          defaults: { ease: "inOutSine" },
        }).add(eyes, {
          keyframes: [
            { x: -5, y: -2, rotate: -7 },
            { x: 4, y: 3, rotate: 6 },
            { x: -3, y: 4, rotate: -5 },
            { x: 2, y: -3, rotate: 4 },
            { x: 0, y: 0, rotate: 0 },
          ],
          duration: 430,
        }),
      );

      setupHoverAnimation("love", (eyes) =>
        createTimeline({
          loop: true,
          autoplay: false,
          defaults: { ease: "inOutSine" },
        }).add(eyes, {
          scale: [1, 1.2, 0.95, 1.12, 1],
          duration: 650,
        }),
      );

      setupHoverAnimation("happiness", (eyes) =>
        createTimeline({
          loop: true,
          autoplay: false,
          defaults: { ease: "inOutSine" },
        }).add(eyes, {
          y: [0, -12, 0],
          duration: 800,
        }),
      );
    </script>
